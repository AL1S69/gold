name: Build GKI 5.10 LTS Kernel (zako~kernel+SUKISU)

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 安装编译依赖
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
            git make bison flex gcc-aarch64-linux-gnu bc libssl-dev libelf-dev \
            python3 curl liblz4-tool zstd clang lld llvm libncurses5-dev
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: 2. 克隆官方GKI 5.10 LTS源码
        run: |
          git clone --depth=1 https://github.com/Winkmoon/android_gki_kernel_5.15_common.git GKI5.10
          cd GKI5.10
          git submodule update --init --depth=1
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

      - name: 3. 缓存Clang工具链
        id: cache-clang
        uses: actions/cache@v3
        with:
          path: ./GKI5.10/clang-r547379
          key: clang-r547379-gki510-lts

      - name: 4. 下载Clang（缓存未命中）
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          cd ${{ env.KERNEL_DIR }}
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
          mkdir -p clang-r547379 && tar zxf clang.tar.gz -C clang-r547379 --skip-old-files
          rm -f clang.tar.gz
          echo "CLANG_DIR=$(pwd)/clang-r547379" >> $GITHUB_ENV

      - name: 5. 集成SukiSU-Ultra（main分支）
        run: |
          cd ${{ env.KERNEL_DIR }}
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          [ -d "KernelSU" ] && echo "SUKISU集成成功" || exit 1

      - name: 6. 仅为SUKISU模块启用C99（核心修复，不影响内核全局）
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo 'EXTRA_CFLAGS += -std=c99 -Wno-gcc-compat -Wno-unused-command-line-argument' >> drivers/kernelsu/kpm/Makefile
          echo 'EXTRA_CFLAGS += -Wno-type-limits -Wno-pointer-arith' >> drivers/kernelsu/Makefile
          sed -i '/KBUILD_CFLAGS += -std=gnu99/d' Makefile 2>/dev/null

      - name: 7. 修改内核名（-zako~kernel）
        run: |
          sed -i "s/LOCALVERSION=.*/LOCALVERSION=-zako~kernel/" ${{ env.KERNEL_DIR }}/Makefile

      - name: 8. 配置GKI+SUKISU（移除全局C99配置项）
        run: |
          cd ${{ env.KERNEL_DIR }}
          rm -rf out
          mkdir -p out
          make O=out ARCH=arm64 gki_defconfig
          make O=out ARCH=arm64 olddefconfig

      - name: 9. 全核心编译GKI 5.10内核+DTB（参数隔离根治HOST GCC报错）
        run: |
          set -xe
          cd ${{ env.KERNEL_DIR }}

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          # 全局关闭寄存器分配顾问
          export LLVM_NO_REGALLOC_ADVISOR=1

          # 交叉编译内核工具链
          export CC=${{ env.CLANG_DIR }}/bin/clang
          export CXX=${{ env.CLANG_DIR }}/bin/clang++
          export LD=${{ env.CLANG_DIR }}/bin/ld.lld
          export AR=${{ env.CLANG_DIR }}/bin/llvm-ar
          export NM=${{ env.CLANG_DIR }}/bin/llvm-nm
          export OBJCOPY=${{ env.CLANG_DIR }}/bin/llvm-objcopy
          export OBJDUMP=${{ env.CLANG_DIR }}/bin/llvm-objdump
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # HOST主机全套LLVM，独立环境，隔离所有内核LLVM参数
          export HOSTCC=${{ env.CLANG_DIR }}/bin/clang
          export HOSTCXX=${{ env.CLANG_DIR }}/bin/clang++
          export HOSTLD=${{ env.CLANG_DIR }}/bin/ld.lld
          export HOSTAR=${{ env.CLANG_DIR }}/bin/llvm-ar

          # -------------------核心隔离改动-------------------
          # 1. 主机编译完全清空所有全局标记，杜绝-mllvm流入HOST编译
          export KBUILD_HOST_CFLAGS=""
          export KBUILD_HOST_CXXFLAGS=""
          export KBUILD_HOST_LDFLAGS=""
          unset CFLAGS CXXFLAGS LDFLAGS KBUILD_CFLAGS

          # 2. 不再全局导出KBUILD_CFLAGS，改为仅在make命令行传给内核
          # 把所有LLVM/警告参数移到编译指令，HOST编译完全不会读取
          KERNEL_CFLAGS="-std=gnu99 -Wno-error -Wno-error=unknown-warning-option -mllvm -regalloc-evict-advisor=0"
          # ---------------------------------------------------

          export KBUILD_LTO=none
          export MAKEFLAGS="-j$(nproc)"

          # 彻底清理旧构建缓存
          make clean
          rm -rf .tmp_versions modules.order Module.symvers out

          # 生成配置，关闭Polly、寄存器优化
          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          sed -i '/CONFIG_POLLY/d' out/.config
          sed -i '/CONFIG_POLLY_VECTORIZER/d' out/.config
          sed -i '/CONFIG_POLLY_ISL/d' out/.config
          sed -i 's/CONFIG_LLVM_REGALLOC_ADVISOR=y/CONFIG_LLVM_REGALLOC_ADVISOR=n/' out/.config

          # 编译时单独传递内核CFLAGS，HOST编译全程无LLVM专属参数
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC=$HOSTCC \
            HOSTCXX=$HOSTCXX \
            KBUILD_CFLAGS="$KERNEL_CFLAGS" \
            Image dtbs > build.log 2>&1 || (cat build.log && exit 1)

          # 导出产物
          mkdir -p ${{ env.KERNEL_DIR }}/boot
          cp -r out/arch/arm64/boot/* ${{ env.KERNEL_DIR }}/boot/
          ls -l ${{ env.KERNEL_DIR }}/boot/

      - name: 10. 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: "zako~kernel-gki510-lts-sukisu"
          path: ${{ env.KERNEL_DIR }}/boot/**/*
          retention-days: 14
